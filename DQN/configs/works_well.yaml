training:
  algorithm: double_dqn
  optimizer: adam
  learning_rate: 6.25e-5
  batch_size: 1024
  replay_buffer_size: 1_000_000
  replay_alpha: 0.5                  # prioritization exponent
  replay_beta_start: 0.4             # importance-sampling exponent (annealed to 1.0)
  target_tau: 0.005                  # Polyak averaging coefficient
  train_every_n_steps: 4             # gradient update frequency
  warmup_transitions: 50000          # don't train until this many transitions are in the buffer
  gamma: 1.0                         # discount within a hand (short horizon)
  n_step: 3                          # Rainbow n-step return horizon for play-head targets
  total_hands: 200_000_000           # joint training budget
  total_hands_no_count: 20_000_000
  total_hands_with_count: 50_000_000

