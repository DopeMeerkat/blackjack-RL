# All hyperparameters for the blackjack RL project.
# Do not hard-code any of these values in training scripts — load this file instead.
# See blackjack_rl_design.md §16 for the full reference.

env:
  num_decks: 6
  # Reshuffle when cards_remaining / 52 < reshuffle_threshold
  reshuffle_threshold: 1.5        # decks remaining that triggers reshuffle (= 78 cards)
  dealer_stands_soft_17: true     # S17 rule
  double_after_split: true          # DAS allowed
  # Max total sub-hands from splitting (3 splits = 4 hands)
  resplit_max_hands: 3
  blackjack_payout: 1.5           # 3:2
  surrender: false
  # Insurance is hard-coded (not learned): take when true count >= threshold
  insurance_tc_threshold: 3
  num_envs: 64                    # parallel environments
  bet_multipliers: [1, 2, 4, 8, 12]
  true_count_clip: 5.0            # clip TC to [-5, +5] before normalizing
  true_count_min_decks: 0.5       # floor for TC denominator (prevents div by ~0)

state:
  obs_dim: 28
  playing_actions: 4              # hit=0, stand=1, double=2, split=3
  bet_actions: 5                  # indices into bet_multipliers

