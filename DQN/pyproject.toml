[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackjack-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# PyTorch is listed separately because the GPU-variant install command differs
# per machine. Install manually:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
# or the appropriate CUDA/CPU variant for your system.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
